[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chatify-app"
version = "0.4.33"
readme = "README.md"
description = "Chat with your documents. One YAML file, cited answers, offline demo."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.3,<7"]
license = {text = "MIT"}

[project.scripts]
chatify = "chatify.cli:main"
chatify-app = "chatify.cli:main"
customchat = "chatify.cli:main"
customchat-app = "chatify.cli:main"

[tool.setuptools.packages.find]
include = ["chatify*", "apps*"]

[tool.setuptools.package-data]
chatify = ["web/*", "web/fonts/*", "web/logos/*.svg", "web/icons/*.svg", "web/team/*.jpg", "web/emoji/*", "templates/minimal/app.yaml", "templates/minimal/docs/*.md"]
"apps" = ["*.yaml", "**/*.yaml", "**/*.md", "**/*.txt", "**/*.pdf", "**/*.json", "**/*.py", "**/*.example"]

[project.urls]
Repository = "https://github.com/Harsh23Kashyap/chatify"

[project.optional-dependencies]
documents = ["pypdf>=4", "fpdf2>=2.8", "uharfbuzz>=0.39"]
semantic = ["sentence-transformers>=3"]
