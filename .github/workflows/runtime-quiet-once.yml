name: bounded runtime quiet contract
on:
  push:
    paths:
      - .github/workflows/runtime-quiet-once.yml
permissions:
  contents: read
jobs:
  exact-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install base application and browser driver only
        run: |
          python -m pip install .
          mkdir -p "$RUNNER_TEMP/runtime-driver"
          npm install --prefix "$RUNNER_TEMP/runtime-driver" --no-audit --no-fund playwright-core@1.56.1
      - name: Explicit browser and contract preflight
        run: |
          test -x /usr/bin/google-chrome
          test "$(/usr/bin/google-chrome --version | xargs)" = "Google Chrome 155.0.8059.39"
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.15"
          test "$(node --version)" = "v22.23.3"
          test "$(sha256sum tests/builder_keep_current_runtime_motion_browser.cjs | cut -d' ' -f1)" = "6ffae0e39e441e5bcfc860f60abca4c3034c29965faf20a1099b6a1b723f2576"
          test "$(sha256sum tests/fixtures/builder-complete.yaml | cut -d' ' -f1)" = "3c12231e3b66be5535d9233c21542270674107051017a3f1a030805037eb41ca"
          /usr/bin/google-chrome --version
          python --version
          node --version
          sha256sum tests/builder_keep_current_runtime_motion_browser.cjs tests/fixtures/builder-complete.yaml
          git diff --exit-code -- tests/builder_keep_current_runtime_motion_browser.cjs chatify/web/appbuilder.js
      - name: Run four sequential unchanged full runtime cases against offline fixture
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/runtime-driver/node_modules/playwright-core
          CHATIFY_TEST_URL: http://127.0.0.1:8765
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-fixture"
          mkdir -p "$RUNNER_TEMP/runtime-fixture/app"
          cp tests/fixtures/builder-trip.yaml "$RUNNER_TEMP/runtime-fixture/app/app.yaml"
          python -m chatify run "$RUNNER_TEMP/runtime-fixture/app/app.yaml" --host 127.0.0.1 --port 8765 --no-browser > "$RUNNER_TEMP/runtime-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=1) as response:
                      assert response.status == 200
                  break
              except Exception:
                  time.sleep(.1)
          else:
              raise SystemExit('offline fixture server did not become ready')
          PY
          for execution in 2 3 4 5; do
            echo "EXACT_RUNTIME_EXECUTION_BEGIN $execution"
            timeout 120 node tests/builder_keep_current_runtime_motion_browser.cjs
            echo "EXACT_RUNTIME_EXECUTION_PASS $execution"
          done
      # Only ordinary job logs are retained. No artifact or cache uploads, no secrets,
      # production account access, environment dump or user-state paths are involved.
