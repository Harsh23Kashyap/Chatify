name: single disclosure diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install offline diagnostic dependencies
        run: |
          python -m pip install .
          mkdir -p /tmp/cc-ui-tools
          sudo mkdir -p /downloads
          sudo chown "$(id -u):$(id -g)" /downloads
          npm install --prefix /tmp/cc-ui-tools --no-audit --no-fund playwright-core@1.56.1
      - name: One unchanged strict disclosure execution with timeline
        env:
          PLAYWRIGHT_MODULE: /tmp/cc-ui-tools/node_modules/playwright-core
          PYTHONUNBUFFERED: '1'
        run: |
          /usr/bin/google-chrome --version
          python tests/ci/disclosure_diagnostic.py
      # Manual only, no repeats, uploads, secrets, private questions, or live calls.
