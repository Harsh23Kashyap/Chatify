pipeline_prompts:
  text:
    question_check: 'Trip planning fixture question gate. You decide whether a question
      is something this assistant should answer from its sources.


      Reply with one line. Start with VALID if the question is on topic and clear
      enough to search, or INVALID followed by a colon and a short, friendly reason
      the reader can act on.


      Greetings and thanks are VALID. Do not answer the question.


      Audience: trip planners. Use plain language and source-backed guidance.'
    standalone: 'Rewrite the last question so it can be understood alone. Return only
      the rewritten question.

      Audience: beginner gardeners. Use plain language and source-backed guidance.'
    queries: 'Write up to 3 short keyword search queries for the question. One per
      line, no numbering.

      Audience: beginner gardeners. Use plain language and source-backed guidance.'
    expand: 'Rewrite the question as one search query that keeps every original word
      and adds only standard synonyms or technical equivalents for its terms. Do not
      change the meaning, do not add or remove negation, do not add new topics. Return
      only the rewritten query.

      Audience: beginner gardeners. Use plain language and source-backed guidance.'
    relevance: 'You check retrieved passages against a question. Each passage has
      a number in square brackets.

      Reply with only the numbers of the passages that help answer the question, separated
      by commas. Reply NONE if no passage helps. Be strict: a passage that only shares
      a word with the question does not help.

      Audience: beginner gardeners. Use plain language and source-backed guidance.'
    answer: 'You answer only from the numbered evidence. Cite with [n], placing each
      number right after the clause it supports, not at the end of the answer. If
      the evidence does not cover the question, say so in one plain sentence with
      no citations and do not point the reader elsewhere. Take one clear stance that
      matches the evidence and do not add claims the passages do not make: no years,
      numbers or study details that are not written in a passage, and no remarks about
      limits (such as small or short) unless a passage states them. Refer to the sources
      as "the sources" or "the studies cited", never "the evidence provided" or "the
      passages". Do not call a benefit lasting or durable, and do not describe the
      reader''s own situation, unless a passage says so. Report each outcome as the
      passage measures it: fat mass is not body weight, and use "suggested" or "may"
      when the passage does, not "concluded" or "showed". Do not add causal links
      such as "therefore" that no passage makes, and write "in some settings or groups"
      instead of "for some people" unless a passage names who. When a passage reports
      a result that cuts against the main conclusion, such as another outcome where
      the comparison group did better, include it.

      Audience: beginner gardeners. Use plain language and source-backed guidance.'
    faithfulness: 'You verify an answer against its evidence. Each evidence passage
      has a number in square brackets.

      If every claim in the answer is supported by the evidence, reply with exactly
      OK.

      Otherwise reply with UNSUPPORTED followed by a colon and a short list of the
      claims that the evidence does not support. Do not rewrite the answer.

      Audience: beginner gardeners. Use plain language and source-backed guidance.'
    revise: 'You edit an answer so it stays inside its numbered evidence passages.

      Rules: keep every [n] citation in place and keep the same length and structure.
      Delete or rewrite any statement, number, year or descriptive word (small, short,
      lasting, strong) that the cited passage does not state. If a cited passage says
      the participants lost weight or that a comparison group did better on an outcome,
      the answer must say so. Keep the direction of every comparison finding (which
      group did better or regained less) and keep the key numbers the passages give
      for the main result (effect sizes, group sizes, durations); never reduce a directional
      finding to a bare report that something happened. Call the sources ''the sources'',
      never ''the evidence provided''. Reply with only the edited answer.

      Audience: beginner gardeners. Use plain language and source-backed guidance.'
    followups: 'Suggest 3 short follow-up questions a curious reader might ask next.
      One per line, no numbering.

      Audience: beginner gardeners. Use plain language and source-backed guidance.'
    summary: 'Summarise the conversation topics in 2 sentences.

      Audience: beginner gardeners. Use plain language and source-backed guidance.'
  'on':
    question_check: false
    standalone: true
    queries: true
    expand: true
    relevance: false
    answer: true
    faithfulness: false
    revise: false
    followups: true
    summary: true
