schema_version: 1
actions:
  allow: null
  writes: false
budget:
  daily_questions: 0
  user_daily_questions: 0
  daily_model_calls: 0
  spend_cap_usd: null
app:
  id: f1-edu-aero-safety-rules
  title: Formula One Chat
  tagline: Explore Formula 1 car aerodynamics, safety, and sporting rules with trusted
    sources.
  accent: '#173f35'
  accent2: '#d7ef72'
  footer: Cited Formula 1 sources. FIA regulation snapshots are dated; check the current
    issue for competition decisions.
  examples:
  - How does aerodynamics affect Formula 1 car performance?
  - What are the key safety features in modern Formula 1 cars?
  - Can you explain the sporting rules regarding pit stops in Formula 1?
  language: en
  theme: auto
provider:
  type: openai
  model: gpt-4.1-mini
  base_url: ''
  api_key_env: OPENAI_API_KEY
  temperature: 0.2
  timeout: 120
  fallback: null
  max_output_tokens: 4096
sources:
- id: fia-regulations
  type: python
  label: FIA 2026 technical and sporting regulations (dated snapshots)
  entry: f1_sources:search
  weight: 1.0
- id: api-1
  label: arXiv
  weight: 1.0
  type: arxiv
- id: api-2
  label: Crossref
  weight: 1.0
  type: crossref
- id: api-3
  label: Wikipedia
  weight: 1.0
  type: wikipedia
- id: api-4
  label: PubMed
  weight: 1.0
  type: pubmed
retrieval:
  top_k: 12
  min_score: 0.0
  query_rewrite: true
  cache_ttl: 0
prompt:
  system: 'You answer only from the numbered evidence. Cite with [n], placing each
    number right after the clause it supports, not at the end of the answer. If the
    evidence does not cover the question, say so in one plain sentence with no citations
    and do not point the reader elsewhere. Take one clear stance that matches the
    evidence and do not add claims the passages do not make: no years, numbers or
    study details that are not written in a passage, and no remarks about limits (such
    as small or short) unless a passage states them. Refer to the sources as "the
    sources" or "the studies cited", never "the evidence provided" or "the passages".
    Do not call a benefit lasting or durable, and do not describe the reader''s own
    situation, unless a passage says so. Report each outcome as the passage measures
    it: fat mass is not body weight, and use "suggested" or "may" when the passage
    does, not "concluded" or "showed". Do not add causal links such as "therefore"
    that no passage makes, and write "in some settings or groups" instead of "for
    some people" unless a passage names who.'
  style:
    quick: Answer in 2 to 4 sentences.
    standard: Give a full, source-backed answer. Start with the direct answer, then
      explain the relevant findings, examples, comparisons and counterpoints supported
      by the sources. Use readable paragraphs and descriptive sections when useful.
      For broad questions with ample evidence, give several substantial paragraphs
      rather than a brief summary. For narrow questions or sparse evidence, stay concise.
      Cite each factual claim with [n]. Do not pad, repeat points or invent details
      to reach a length.
    deep: Give a detailed, source-backed synthesis with a direct answer, organized
      sections, and comparison of relevant findings across sources. Explain methods,
      mechanisms, examples, trade-offs, counterpoints and uncertainties only when
      the sources support them. Cover distinct relevant findings rather than repeating
      the same point. Be more thorough than standard mode when evidence permits; do
      not invent background, caveats or open questions to fill space. Cite each factual
      claim with [n].
  answer_note: ''
  revise: false
  no_evidence: I could not find evidence for that in the configured sources.
memory:
  enabled: true
  recent_turns: 4
  summary_every: 6
  context_chars: 60000
citations:
  required: true
  ledger: true
auth:
  mode: none
  token_env: ''
  signup: true
storage:
  path: data/customchat.db
server:
  host: 127.0.0.1
  port: 8080
