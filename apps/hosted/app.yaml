# Hosted public chat demo: shared configuration is temporarily read-only.
# Run: python -m chatify run apps/hosted/app.yaml
# yaml-language-server: $schema=../../schema/chat-app.schema.json
app:
  id: hosted
  title: Chatify
  tagline: Ask about Chatify, or learn how to run your own copy
  examples:
    - What is Chatify?
    - How do I build my own chat app?
    - How are answers cited?
    - How do I run Chatify on my own computer?
  footer: Public chat is available. Shared configuration and app building are read-only. Run your own copy to build an app.
  theme: light         # settings page has no dark theme support; keep every page light and consistent
provider:
  type: openai         # key comes from the OPENAI_API_KEY environment variable on the host
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
sources:
  - id: docs
    type: local_files
    label: Chatify guide
    path: docs
budget:
  daily_questions: 300      # shared across all visitors; 30 questions/minute throttle also applies
  user_daily_questions: 0   # no-auth app: per-person quota would be shared by everyone, so keep it off
  daily_model_calls: 500    # covers chat answers and Build with AI drafting; a full build is up to 36 calls
  spend_cap_usd: null       # the host key carries its own provider-side budget limit

server:
  public: true        # public demo: isolate each browser's chats, recent questions and drafts
