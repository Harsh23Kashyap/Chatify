# The public gallery: one server, many Chatify apps, each at its own endpoint.
# Run: python -m chatify run apps/gallery.yaml
# Hosted apps run on the host's server-side OpenAI key with the caps below;
# per-visitor isolation is forced on and the per-person quota stays off.
# An app entry may instead give a url: its card links out and /<slug>/ redirects,
# so nothing runs on the host key. Card look: icon, tags, accent.
gallery:
  title: Curiosity has many doors.
  tagline: Chat apps built with Chatify, each grounded in its own sources. Pick one and start asking.
  provider:
    type: openai
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
  budget:
    daily_questions: 300
    daily_model_calls: 500
  apps:
    - dir: hosted
      slug: chatify
      accent: '#4f46b8'
      icon: chat
      tags: [Product guide, Build your own]
    - slug: dietchat
      url: https://dietchat.org
      title: DietChat
      tagline: Evidence-based answers on diet and nutrition, cited from PubMed.
      accent: '#30a46c'
      icon: leaf
      tags: [Nutrition, PubMed-cited]
    - slug: wirelesschat
      url: https://wirelesschat-review.onrender.com/
      title: WirelessChat
      tagline: Ask about wireless communications research, with cited papers.
      accent: '#2f6f8f'
      icon: signal
      tags: [Wireless research, Cited papers]
    - dir: formulaone
      slug: formulaone
      accent: '#b3402e'
      icon: flag
      tags: [F1 tech & rules, FIA sources]
    - dir: newsnerd-sample
      slug: newsnerd
      accent: '#8a6d2f'
      icon: news
      tags: [News literacy, Source checks]
    - dir: fitchat
      slug: fitchat
      accent: '#b23a8e'
      icon: heart
      tags: [Exercise, Public health]
    - dir: spacechat
      slug: spacechat
      accent: '#8c4f9e'
      icon: planet
      tags: [Space, Public sources]
