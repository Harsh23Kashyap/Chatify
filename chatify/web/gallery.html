<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title>
<script>try{if(sessionStorage.getItem("cc_nav")==="1"){sessionStorage.removeItem("cc_nav");if(!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("nav-in")}}catch(e){}</script>
<link rel="stylesheet" href="/navflow.css"><script src="/navflow.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Fraunces:wght@600;700&display=swap">
<style>:root{--bg:#f6f2e8;--card:#fffdf7;--ink:#173f35;--mut:#5d6b64;--line:#d9d6c8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "DM Sans",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:56px 24px 64px}
.brand{display:flex;align-items:center;gap:10px;font:700 15px "DM Sans",sans-serif;color:var(--ink);text-decoration:none}
.brand img{width:26px;height:26px}
h1{font-family:Fraunces,Georgia,serif;font-size:clamp(30px,5vw,44px);line-height:1.1;margin:28px 0 10px;letter-spacing:-.01em}
.tag{color:var(--mut);margin:0 0 36px;max-width:560px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.g-card{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px 20px;text-decoration:none;color:var(--ink);overflow:hidden;transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s}
.g-card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--card-accent,#173f35)}
.g-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(23,63,53,.10)}
.g-card:active{transform:scale(.99);transition-duration:90ms}
.g-name{font:700 20px/1.25 "DM Sans",sans-serif}
.g-tag{color:var(--mut);font-size:14.5px;flex:1}
.g-open{font:700 13px "DM Sans",sans-serif;color:var(--card-accent,#173f35);letter-spacing:.02em}
.g-open::after{content:" →";transition:margin .14s}
.g-card:hover .g-open::after{margin-left:3px}
@media(prefers-reduced-motion:no-preference){
.wrap>*{animation:g-up .3s cubic-bezier(.22,1,.36,1) both}
.wrap>*:nth-child(2){animation-delay:.06s}.wrap>*:nth-child(3){animation-delay:.12s}
.g-card{animation:g-up .3s cubic-bezier(.22,1,.36,1) both}
.g-card:nth-child(1){animation-delay:.14s}.g-card:nth-child(2){animation-delay:.19s}.g-card:nth-child(3){animation-delay:.24s}.g-card:nth-child(4){animation-delay:.29s}.g-card:nth-child(5){animation-delay:.34s}.g-card:nth-child(6){animation-delay:.39s}.g-card:nth-child(n+7){animation-delay:.44s}
}
@keyframes g-up{from{opacity:0;transform:translateY(10px)}}
.note{margin-top:34px;color:var(--mut);font-size:14px}
.note a{color:var(--ink)}
@media(prefers-reduced-motion:reduce){.wrap>*,.g-card{animation:none!important}.g-card{transition:none}}
</style></head><body><div class="wrap">
<a class="brand" href="/"><img src="/icons/chatify.svg" alt="">Chatify</a>
<h1>{{TITLE}}</h1>
<p class="tag">{{TAGLINE}}</p>
<div class="grid">{{CARDS}}</div>
<p class="note">Every app here runs on Chatify. Each chat is private to your browser, answers cite their sources, and daily limits keep the shared demo key healthy.</p>
</div></body></html>
