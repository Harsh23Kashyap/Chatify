<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{CODE}} {{TITLE}}</title>
<script>try{if(sessionStorage.getItem("cc_nav")==="1"){sessionStorage.removeItem("cc_nav");if(!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("nav-in")}else{document.documentElement.classList.add("nav-first")}}catch(e){}</script>
<link rel="stylesheet" href="/navflow.css"><script src="/navflow.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>:root{--bg:#f6f2e8;--ink:#173f35;--mut:#5d6b64;--line:#d9d6c8;--acc:#173f35}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 "DM Sans",system-ui,sans-serif;padding:24px}
main{max-width:460px;text-align:center}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:no-preference){
main>*{animation:up .32s cubic-bezier(.22,1,.36,1) both}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.16s}
main>.act{animation-delay:.22s}
svg{animation:up .32s cubic-bezier(.22,1,.36,1) both,float 3.4s ease-in-out .45s infinite}
}
svg{width:150px;height:150px;margin-bottom:6px;color:var(--acc)}
.code{font:600 13px "DM Sans",sans-serif;letter-spacing:.14em;color:var(--mut)}
h1{font-family:Fraunces,Georgia,serif;font-size:30px;margin:6px 0 8px}p{color:var(--mut);margin:0 0 24px}
.act a{display:inline-block;padding:11px 22px;border-radius:12px;background:var(--acc);color:var(--bg);text-decoration:none;font-weight:700;transition:transform .14s,box-shadow .14s}
.act a:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(23,63,53,.18)}.act a:active{transform:scale(.985);transition-duration:90ms}
.act a.q{background:none;color:var(--ink);border:1px solid var(--line);margin-left:8px}
@media(prefers-reduced-motion:reduce){main>*,svg{animation:none!important}}</style></head><body><main>
<svg viewBox="0 0 150 150" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ART}}</svg>
<div class="code">ERROR {{CODE}}</div><h1>{{TITLE}}</h1><p>{{MSG}}</p><div class="act"><a href="/">Home</a><a class="q" href="javascript:history.back()">Go back</a></div></main></body></html>
