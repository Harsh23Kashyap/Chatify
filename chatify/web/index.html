<!doctype html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><style id="cc-boot-css">.cc-boot{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;background:#f6f2e8;transition:opacity .22s ease-out}.cc-boot>div{display:grid;justify-items:center}.cc-boot img{width:56px;height:56px;border-radius:16px}.cc-boot-bar{width:120px;height:5px;margin-top:16px;border-radius:99px;background:#e4ddc9;overflow:hidden}.cc-boot-bar i{display:block;width:55%;height:100%;border-radius:99px;background:#173f35;animation:ccboot 1.1s ease-in-out infinite}.cc-boot-out{opacity:0;pointer-events:none}html[data-theme=dark] .cc-boot{background:#101c17}html[data-theme=dark] .cc-boot-bar{background:#26392f}@keyframes ccboot{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}@media(prefers-reduced-motion:reduce){.cc-boot{transition:none}.cc-boot-bar i{animation:none}}</style>
<script id="cc-theme" type="application/json">{{THEME_JSON}}</script>
<script>(function(){try{var t=JSON.parse(document.getElementById('cc-theme').textContent),preview=/[?&]preview=1/.test(location.search),saved=(function(){try{return localStorage.getItem('cc_mode')}catch(e){return null}})(),mode=preview?'light':(['light','dark','auto'].includes(saved)?saved:t.mode||'light'),dark=mode==='dark'||mode==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.style.colorScheme=dark?'dark':'light';}catch(e){document.documentElement.dataset.theme='light'}})();</script>

<title>{{TITLE}}</title>
<meta name="theme-color" content="{{ACCENT}}">
<style>:root{--accent:{{ACCENT}};--accent2:{{ACCENT2}}}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Fraunces:wght@600;700&display=swap">
<script>try{if(sessionStorage.getItem("cc_nav")==="1"){sessionStorage.removeItem("cc_nav");if(!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("nav-in")}}catch(e){}</script><link rel="stylesheet" href="/navflow.css"><script src="/navflow.js" defer></script><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/motion.css"><script src="/motion.js" defer></script>
<script src="/brand.js"></script><script src="/theme.js"></script>
<link rel="stylesheet" href="/customselect.css"><script src="/customselect.js" defer></script><script src="/emoji.js"></script><link rel="stylesheet" href="/tour.css"><script src="/tour.js"></script><link rel="stylesheet" href="/navigation.css"><link rel="stylesheet" href="/feedback.css"><link rel="stylesheet" href="/loading.css"><script src="/loading.js" defer></script><link rel="prefetch" href="/settings.html"><link rel="prefetch" href="/about.html"><link rel="prefetch" href="/run-locally.html"></head>
<body><div id="cc-boot" class="cc-boot" aria-hidden="true"><div><img src="/icons/chatify.svg" alt=""><div class="cc-boot-bar"><i></i></div></div></div>
<a class="skip" href="#q">Skip to question box</a>
<header class="toolbar"><div class="tb-brand" id="brand"></div><nav class="common-nav" aria-label="Main navigation"><a href="/" class="active" aria-current="page">Chat</a><a href="/about.html">About</a><a href="/settings.html">Configuration</a><a href="/run-locally.html">Run locally</a><button type="button" class="cc-guide-replay" id="chatGuide" aria-label="Replay guide">Replay guide</button></nav><div class="nav-status"><span class="badge" id="modelBadge"></span><button class="theme-btn" id="themeBtn" aria-label="Toggle theme"><i></i></button></div></header>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-head">
      <div class="side-title" id="sideTitle"></div>
      <button class="icon side-close" id="sideClose" aria-label="Close chats" title="Close">&times;</button>
      <button class="btn-dark" id="newChat" aria-label="New chat">New chat</button>
      <button class="btn-out" id="tempPill" title="Temporary chat: nothing is saved">Temporary</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search chats" aria-label="Search chats" aria-keyshortcuts="Control+k Meta+k">
    <div class="tabs" role="tablist" aria-label="History view"><button class="tab on" id="history-chats" role="tab" aria-selected="true" aria-controls="list" data-tab="chats">Chats</button><button class="tab" id="history-topics" role="tab" aria-selected="false" aria-controls="list" tabindex="-1" data-tab="topics">Topics</button></div>
    <nav class="list" id="list" role="tabpanel" aria-labelledby="history-chats"></nav>
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
    <div class="note"><strong id="noteName"></strong><span id="noteText"></span></div>
  </aside>
  <main class="main">
    <header class="bar">
      <button class="icon menu" id="menu" aria-label="Menu" title="Open chats"></button>
      <div class="title" id="chatTitle">New chat</div>
      <div class="bar-r"><button class="icon" id="readingBtn" title="Reading preferences" aria-label="Reading preferences">Aa</button><select id="style" aria-label="Answer depth"></select><button class="icon" id="prevQ" title="Previous question (k)" aria-label="Previous question" aria-keyshortcuts="k"></button><button class="icon" id="nextQ" title="Next question (j)" aria-label="Next question" aria-keyshortcuts="j"></button><button class="icon" id="tempBtn" hidden title="Temporary chat: nothing is saved" aria-label="Temporary chat" aria-pressed="false">◔</button><button class="icon" id="profileBtn" title="My profile" aria-label="My profile">☺</button><button class="icon" id="newTopic" title="Start a new conversation in this chat" aria-label="New conversation"></button><button class="icon" id="exportChat" title="Export chat as Markdown" aria-label="Export chat">⤓</button></div>
    </header>
    <div id="pipelineStatus" class="pipeline-status" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <section class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></section>
    <button class="jump" id="jump" aria-label="Scroll to latest" title="Scroll to latest"></button>
    <footer class="composer">

      <div class="pills" id="similar" aria-label="Asked before"></div>
      <div class="pills" id="pills"></div>
      <div class="box">
        <button class="icon" id="upload" title="Add files or a web link" aria-label="Add file"></button>
        <button class="icon" id="mic" title="Dictate" aria-label="Dictate" hidden></button>
        <textarea id="q" rows="1" placeholder="Ask a question" aria-label="Ask a question about your sources" maxlength="2000"></textarea>
        <button class="send" id="send" aria-label="Send" aria-keyshortcuts="Enter Control+Enter Meta+Enter" title="Send question"></button>
      </div>
      <div class="composer-tools" role="group" aria-label="Question tools"><button id="scopeBtn" class="chip" title="Choose documents for the next answer" aria-label="Source scope: all documents">Source scope</button><button id="actionsBtn" class="chip" title="Preview and confirm a local note action">Actions</button><span id="scopeChip"></span><p id="actionsError" class="scope-load-error" role="status" aria-live="polite" hidden></p><p id="scopeError" class="scope-load-error" role="status" aria-live="polite" hidden></p></div>
      <div class="cmeta"><span id="hint"></span><span>Not a substitute for professional advice.</span></div>
    </footer>
  </main>
  <aside class="sources" id="sources" aria-label="Sources"></aside>
</div>
<script src="/reading.js" defer></script><script src="/app.js"></script>
<script src="/feedback.js"></script></body>
</html>
